<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titulo-pagina">Cargando... - Blog Matemático</title>
    <style>
        html {
            min-height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 20px auto;
            padding: 10px;
            color: #222;
        }
        
        main {
    background: rgba(255, 255, 255, 0.94);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    overflow-x: auto;
}
        header {
             background: rgba(255, 255, 255, 0.94);
    border-bottom: 3px solid #2980b9;
    border-radius: 12px;
    padding: 20px 30px;
    margin-bottom: 20px;
        }
        .volver {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="volver">← Volver al índice</a>
        <h1 id="titulo-entrada">Cargando título...</h1>
        <small id="fecha-entrada"></small>
    </header>

    <main id="contenido-entrada">
        <p>Cargando contenido...</p>
    </main>

    <script src="posts.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        const postInfo = publicaciones.find(p => p.id === postId);
        const contenedor = document.getElementById('contenido-entrada');

        if (postInfo) {
            document.getElementById('titulo-pagina').textContent = postInfo.titulo + " - Blog Matemático";
            document.getElementById('titulo-entrada').textContent = postInfo.titulo;
            document.getElementById('fecha-entrada').textContent = "Publicado el: " + postInfo.fecha;
            if (postInfo.fondo) {
    document.documentElement.style.backgroundImage = `url("${postInfo.fondo}")`;
}

            const script = document.createElement('script');
            script.src = postInfo.archivo;
            script.onload = () => { contenedor.innerHTML = contenidoEntrada; };
            script.onerror = () => { contenedor.innerHTML = "<p>Error al cargar el contenido de la entrada.</p>"; };
            document.body.appendChild(script);
        } else {
            contenedor.innerHTML = "<p>Entrada no encontrada.</p>";
        }
    </script>
</body>
</html>
